[project]
name = "prospect-scrape-starter"
version = "0.1.0"
description = "Starter API for the prospect-scrape pattern — swap the placeholders for your data source"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
